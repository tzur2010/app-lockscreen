<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://magic-lock-99194-default-rtdb.europe-west1.firebasedatabase.app https://identitytoolkit.googleapis.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <title>&#8203;</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #000; color: #fff; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; overflow: hidden; user-select: none; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; transition: opacity .3s; }
    .code { font-size: min(26vw, 190px); font-weight: 800; letter-spacing: .06em; line-height: 1; font-variant-numeric: tabular-nums; direction: ltr; word-break: break-all; }
    .code.flash { animation: flash .9s ease-out; }
    @keyframes flash { 0% { color: #4ade80; transform: scale(1.08); } 100% { color: #fff; transform: scale(1); } }
    .mode { margin-top: 14px; font-size: 15px; color: #64748b; font-weight: 600; }
    .history { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; direction: ltr; }
    .history span { font-size: 15px; color: #475569; font-variant-numeric: tabular-nums; }
    .status { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; color: #334155; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #475569; margin-inline-end: 6px; vertical-align: middle; }
    .dot.on { background: #22c55e; }
    .wait { font-size: 18px; color: #475569; line-height: 1.6; }
    /* מצב סמוי: כמעט שחור, ספרות קטנות ואפורות */
    body.stealth .code { font-size: min(12vw, 70px); color: #1f2937; }
    body.stealth .code.flash { animation: none; }
    body.stealth .mode, body.stealth .history, body.stealth .wait { display: none; }
    body.stealth .status { color: #111827; }
    .bad { color: #f87171; font-size: 17px; line-height: 1.7; padding: 0 20px; }

    /* שלט רחוק */
    .remote-toggle { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; z-index: 5; background: #111827; color: #94a3b8; border: 1px solid #1f2937; border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 700; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: #0b1120; border-top: 1px solid #1f2937; border-radius: 20px 20px 0 0; padding: 16px 16px calc(34px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s ease; }
    body.panel-open .panel { transform: translateY(0); }
    .panel-row { margin-bottom: 14px; }
    .panel-label { font-size: 13px; color: #64748b; font-weight: 700; margin-bottom: 7px; display: flex; justify-content: space-between; }
    .seg { display: grid; gap: 6px; }
    .seg.two { grid-template-columns: 1fr 1fr; }
    .seg.five { grid-template-columns: repeat(5, 1fr); }
    .pbtn { background: #111827; border: 1px solid #1f2937; color: #e2e8f0; border-radius: 12px; padding: 12px 6px; font-size: 15px; font-weight: 700; font-family: inherit; }
    .pbtn.on { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
    .pbtn.go { background: #052e16; border-color: #166534; color: #4ade80; }
    .pbtn.sent { background: #166534 !important; color: #fff !important; }
    .pbtn:active { transform: scale(0.97); }
    .panel-status { font-size: 12px; color: #475569; text-align: center; min-height: 16px; }
    body.stealth .remote-toggle, body.stealth .panel { display: none; }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="wait" id="wait">מחכה לקוד...<br><small>Waiting for code...</small></div>
    <div class="code" id="code" style="display:none;"></div>
    <div class="mode" id="mode"></div>
    <div class="history" id="history"></div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">מתחבר...</span> · לחיצה כפולה = מצב סמוי</div>

  <button type="button" class="remote-toggle" id="remoteToggle">🎛️ שלט</button>
  <div class="panel" id="panel">
    <div class="panel-row">
      <div class="panel-label"><span>פתיחה בכל קוד</span><span id="stateForce">—</span></div>
      <div class="seg two">
        <button type="button" class="pbtn" data-cmd="force" data-val="true">דולק</button>
        <button type="button" class="pbtn" data-cmd="force" data-val="false">כבוי</button>
      </div>
    </div>
    <div class="panel-row">
      <div class="panel-label"><span>נפתח בניסיון</span><span id="stateAttempt">—</span></div>
      <div class="seg five">
        <button type="button" class="pbtn" data-cmd="attempt" data-val="1">1</button>
        <button type="button" class="pbtn" data-cmd="attempt" data-val="2">2</button>
        <button type="button" class="pbtn" data-cmd="attempt" data-val="3">3</button>
        <button type="button" class="pbtn" data-cmd="attempt" data-val="4">4</button>
        <button type="button" class="pbtn" data-cmd="attempt" data-val="5">5</button>
      </div>
    </div>
    <div class="panel-row seg two" style="display: none;">
      <button type="button" class="pbtn go" data-cmd="reveal">💬 חשוף בהודעה</button>
      <button type="button" class="pbtn go" data-cmd="call">📞 צלצל עכשיו</button>
    </div>
    <div class="panel-row seg">
      <button type="button" class="pbtn" data-cmd="reset">🔄 איפוס לצופה הבא</button>
    </div>
    <div class="panel-status" id="panelStatus">הפקודות מגיעות לטלפון בשקט, בלי רטט ובלי שום סימן על המסך.</div>
  </div>

  <script>
    (function () {
      var DB = 'https://magic-lock-99194-default-rtdb.europe-west1.firebasedatabase.app';
      var channel = String(location.hash || '').replace('#', '');
      var $ = function (id) { return document.getElementById(id); };
      var history = [];
      var lastAt = 0;
      var first = true;

      if (!/^[A-Za-z0-9]{12}$/.test(channel)) {
        $('wrap').innerHTML = '<div class="bad">הקישור לא תקין.<br>פתח אותו שוב מתוך האפליקציה (הגדרות ← הצצה ← שלח את הקוד לטלפון שני).</div>';
        $('statusText').textContent = '';
        return;
      }

      // המסך נשאר דלוק כל עוד הדף פתוח
      var wakeLock = null;
      function keepAwake() {
        try {
          if (navigator.wakeLock && document.visibilityState === 'visible') {
            navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
          }
        } catch (e) {}
      }
      keepAwake();
      document.addEventListener('visibilitychange', keepAwake);

      var lastTap = 0;
      document.addEventListener('click', function (ev) {
        if (ev.target && ev.target.closest && ev.target.closest('.panel, .remote-toggle')) return;
        var now = Date.now();
        if (now - lastTap < 350) document.body.classList.toggle('stealth');
        lastTap = now;
        keepAwake();
      });

      function modeLabel(m) {
        m = String(m || '').toUpperCase();
        if (m === 'PATTERN') return 'דפוס · Pattern';
        if (m === 'WORDS') return 'סיסמה · Password';
        if (m === 'TEST') return 'בדיקה ✓ · Test';
        return 'קוד · PIN';
      }

      function show(data) {
        if (!data || !data.code) return;
        var at = Number(data.at) || 0;
        if (at && at <= lastAt) return;
        lastAt = at;
        // הקוד האחרון שהיה שמור לפני שפתחנו - מציגים בלי רטט
        var isOld = first && at && Date.now() - at > 30000;
        first = false;
        $('wait').style.display = 'none';
        var c = $('code');
        c.style.display = '';
        c.textContent = data.code;
        c.classList.remove('flash');
        void c.offsetWidth;
        if (!isOld) c.classList.add('flash');
        $('mode').textContent = isOld ? 'קוד קודם · Previous' : modeLabel(data.mode);
        if (!isOld) {
          try { navigator.vibrate && navigator.vibrate([60, 60, 60]); } catch (e) {}
          history.unshift(data.code);
          history = history.slice(0, 6);
          $('history').innerHTML = '';
          history.slice(1).forEach(function (h) {
            var s = document.createElement('span');
            s.textContent = h;
            $('history').appendChild(s);
          });
        }
      }

      function setOnline(on, text) {
        $('dot').classList.toggle('on', on);
        $('statusText').textContent = text;
      }

      var es = null;
      function connect() {
        if (es) es.close();
        es = new EventSource(DB + '/live/' + channel + '.json');
        es.addEventListener('open', function () { setOnline(true, 'מחובר · Live'); });
        es.addEventListener('put', function (e) {
          try {
            var msg = JSON.parse(e.data);
            if (msg.path === '/') show(msg.data);
          } catch (err) {}
        });
        es.addEventListener('patch', function () {});
        es.addEventListener('auth_revoked', connect);
        es.addEventListener('cancel', function () { setOnline(false, 'אין גישה לערוץ'); });
        es.onerror = function () { setOnline(false, 'מתחבר מחדש...'); };
      }
      connect();

      // ---------------- שלט רחוק ----------------
      var API_KEY = 'AIzaSyBTQKq5Lnn0IFu2RROdMxMlaIeFgx721jo';
      var AUTH_KEY = 'magic_peek_remote_auth_v1';

      // זהות אנונימית לטלפון השני (מתחדשת לבד כל שעה)
      function getToken() {
        var cached = null;
        try { cached = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) {}
        if (cached && cached.token && Date.now() < cached.exp) return Promise.resolve(cached.token);
        return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + API_KEY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{"returnSecureToken":true}'
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (!j.idToken) throw new Error('auth');
          try { localStorage.setItem(AUTH_KEY, JSON.stringify({ token: j.idToken, exp: Date.now() + 50 * 60 * 1000 })); } catch (e) {}
          return j.idToken;
        });
      }

      function panelStatus(text, color) {
        $('panelStatus').textContent = text;
        $('panelStatus').style.color = color || '';
      }

      function sendCommand(btn, cmd, val) {
        var body = { cmd: cmd, at: { '.sv': 'timestamp' } };
        if (val !== undefined) body.val = val;
        btn.disabled = true;
        getToken().then(function (token) {
          return fetch(DB + '/ctrl/' + channel + '.json?auth=' + encodeURIComponent(token), { method: 'PUT', body: JSON.stringify(body) });
        }).then(function (r) {
          if (!r.ok) throw new Error('send');
          btn.classList.add('sent');
          try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
          panelStatus('נשלח ✓', '#4ade80');
          setTimeout(function () { btn.classList.remove('sent'); }, 700);
        }).catch(function () {
          try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
          panelStatus('לא נשלח - בדוק אינטרנט ונסה שוב', '#f87171');
        }).then(function () { btn.disabled = false; });
      }

      document.querySelectorAll('.pbtn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var cmd = btn.getAttribute('data-cmd');
          var raw = btn.getAttribute('data-val');
          var val = raw === null ? undefined : raw === 'true' ? true : raw === 'false' ? false : Number(raw);
          sendCommand(btn, cmd, val);
        });
      });

      $('remoteToggle').addEventListener('click', function () {
        document.body.classList.toggle('panel-open');
      });

      // מצב נוכחי של הטלפון שביד הצופה
      function showState(s) {
        var on = s && s.force === true;
        var attempt = s && s.attempt;
        $('stateForce').textContent = s ? (on ? 'דולק ✓' : 'כבוי') : 'הטלפון לא מחובר';
        $('stateAttempt').textContent = s ? 'ניסיון ' + attempt : '';
        document.querySelectorAll('.pbtn[data-cmd="force"]').forEach(function (b) {
          b.classList.toggle('on', Boolean(s) && String(on) === b.getAttribute('data-val'));
        });
        document.querySelectorAll('.pbtn[data-cmd="attempt"]').forEach(function (b) {
          b.classList.toggle('on', Boolean(s) && Number(b.getAttribute('data-val')) === Number(attempt));
        });
      }
      var stateSource = new EventSource(DB + '/state/' + channel + '.json');
      stateSource.addEventListener('put', function (e) {
        try {
          var msg = JSON.parse(e.data);
          if (msg.path === '/') showState(msg.data);
        } catch (err) {}
      });
    })();
  </script>
</body>
</html>
