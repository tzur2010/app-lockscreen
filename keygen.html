<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מחולל קודי הפעלה - Magic Lockscreen Keygen</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0e0e12;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 13.5px; color: rgba(255,255,255,0.65); margin: 0 0 20px; line-height: 1.5; }
    input {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      padding: 0 14px;
      margin-bottom: 14px;
      direction: ltr;
    }
    button {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: #3888ff;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: none;
    }
    .result-code {
      font-family: monospace;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #38bdf8;
      margin: 6px 0 10px;
    }
    .master-note {
      margin-top: 18px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>מחולל קודי הפעלה (4 ספרות + 5555)</h1>
    <p>הקלד את מזהה המכשיר בן 4 הספרות של הלקוח כדי לחשב את קוד ההפעלה שלו:</p>
    <input type="number" id="deviceIdInput" placeholder="למשל: 4821" autocomplete="off" />
    <button type="button" id="genBtn">חשב קוד הפעלה</button>
    <div class="result-box" id="resultBox">
      <div style="font-size: 13px; color: rgba(255,255,255,0.7);">קוד הפעלה ללקוח:</div>
      <div class="result-code" id="resultCode">----</div>
      <button type="button" id="copyCodeBtn" style="height: 36px; font-size: 13px;">העתק קוד</button>
    </div>
    <div class="master-note">קוד מאסטר קבוע למפתח: <strong>MASTER999</strong></div>
  </div>
  <script>
    document.getElementById('genBtn').addEventListener('click', () => {
      const val = parseInt(document.getElementById('deviceIdInput').value.trim(), 10);
      if (isNaN(val)) return;
      const code = String(val + 5555);
      document.getElementById('resultCode').textContent = code;
      document.getElementById('resultBox').style.display = 'block';
    });
    document.getElementById('copyCodeBtn').addEventListener('click', () => {
      const code = document.getElementById('resultCode').textContent;
      navigator.clipboard.writeText(code);
      document.getElementById('copyCodeBtn').textContent = 'הועתק ✓';
      setTimeout(() => document.getElementById('copyCodeBtn').textContent = 'העתק קוד', 1500);
    });
  </script>
</body>
</html>
