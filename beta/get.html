<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="theme-color" content="#060609">
  <title>Lockscreen</title>
  <meta property="og:title" content="Lockscreen - הצופה מקליד קוד. אתה עם הגב. ואתה יודע כל ספרה.">
  <meta property="og:description" content="אפליקציית קסמים לטלפון: כל ספרה שהצופה לוחץ נלחשת לך באוזנייה. אנדרואיד ואייפון.">
  <style>
    :root {
      --bg: #0b0a09; --panel: #171615; --panel2: #1e1c1a; --line: rgba(255,238,210,.08); --line2: rgba(255,238,210,.14);
      --text: #f6f1e8; --muted: #a69d90; --soft: #d6cec2; --accent: #e7b85c; --accent2: #f6d68f;
      --grad: linear-gradient(135deg, #f6d68f 0%, #e7b85c 55%, #c99436 100%); --ink: #1a1408;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    body::before { content: ''; position: fixed; inset: -20% -10% auto; height: 70vh; background: radial-gradient(50% 50% at 50% 50%, rgba(231,184,92,.16), transparent 70%); pointer-events: none; z-index: 0; }
    main { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 0 20px 40px; }
    .hide { display: none !important; }
    a { color: inherit; }

    /* סרגל עליון */
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 8px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: .2px; direction: ltr; }
    .mark { width: 32px; height: 32px; border-radius: 9px; background: var(--grad); color: var(--ink); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(231,184,92,.35); }
    .mark svg { width: 17px; height: 17px; }
    .lang { background: transparent; border: 1px solid var(--line2); color: var(--soft); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }

    /* פתיח */
    .hero { text-align: center; padding: 34px 0 10px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 14px; border-radius: 999px; border: 1px solid var(--line2); background: rgba(255,255,255,.03); color: var(--soft); font-size: 12.5px; font-weight: 600; }
    .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 10px var(--accent); }
    h1 { margin: 18px 0 14px; font-size: 37px; line-height: 1.15; font-weight: 700; letter-spacing: -.5px; }
    h1 .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { margin: 0 auto; max-width: 400px; color: var(--muted); font-size: 16.5px; }
    .cta-row { display: flex; gap: 10px; margin: 24px 0 6px; }
    .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; border: none; font: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .btn-main { background: var(--text); color: #0a0a10; }
    .btn-grad { background: var(--grad); color: var(--ink); box-shadow: 0 10px 30px rgba(231,184,92,.28); }
    .btn-ghost { background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--line2); }
    .meta { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 8px; }

    /* הדגמה */
    .demo { margin: 30px 0 0; padding: 18px 16px 16px; border-radius: 26px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); box-shadow: 0 30px 60px rgba(0,0,0,.45); }
    .demo-grid { display: flex; align-items: center; gap: 14px; }
    .phone-col { width: 50%; flex: none; }
    .phone { position: relative; aspect-ratio: 9 / 19.5; border-radius: 30px; padding: 6px; background: linear-gradient(145deg, #2a2a33, #111116); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 20px 40px rgba(0,0,0,.6); }
    .screen { position: relative; height: 100%; border-radius: 25px; overflow: hidden; background: radial-gradient(120% 60% at 30% 0%, #3a2f22 0%, transparent 60%), linear-gradient(170deg, #1f1a14 0%, #15110d 55%, #0d0b09 100%); display: flex; flex-direction: column; align-items: center; padding-top: 20%; }
    .cam { position: absolute; top: 2.4%; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #000; box-shadow: 0 0 0 1.5px #1a1a1a; }
    .pin-title { color: rgba(255,255,255,.92); font-size: 11.5px; font-weight: 600; }
    .dots { direction: ltr; display: flex; gap: 9px; margin: 10px 0 13%; }
    .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.4px solid rgba(255,255,255,.7); transition: background .15s; }
    .dot.on { background: #fff; }
    .keys { direction: ltr; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px 11px; width: 80%; }
    .key { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 500; background: rgba(255,255,255,.1); transition: background .12s, transform .12s; }
    .key.blank { background: transparent; }
    .key.hit { background: rgba(255,255,255,.5); transform: scale(.9); }
    .finger { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: rgba(255,255,255,.35); border: 1.5px solid rgba(255,255,255,.9); box-shadow: 0 4px 14px rgba(0,0,0,.4); transition: left .45s cubic-bezier(.3,.8,.3,1), top .45s cubic-bezier(.3,.8,.3,1), transform .12s, opacity .3s; z-index: 3; left: 50%; top: 108%; opacity: 0; }
    .finger.in { opacity: 1; }
    .finger.tap { transform: scale(.72); }

    .ear-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .ear { padding: 14px 12px; border-radius: 18px; background: rgba(231,184,92,.07); border: 1px solid rgba(231,184,92,.3); }
    .ear-h { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: #f6d68f; }
    .ear-h svg { width: 15px; height: 15px; flex: none; }
    .ear-word { font-size: 25px; font-weight: 700; margin: 6px 0 8px; min-height: 36px; letter-spacing: .3px; transition: opacity .15s; }
    .wave { direction: ltr; display: flex; align-items: center; gap: 3px; height: 22px; }
    .wave span { flex: 1; height: 3px; border-radius: 2px; background: rgba(246,214,143,.4); transition: height .12s; }
    .wave.on span { animation: wv .5s ease-in-out infinite alternate; }
    .wave.on span:nth-child(2n) { animation-delay: .1s; } .wave.on span:nth-child(3n) { animation-delay: .2s; } .wave.on span:nth-child(5n) { animation-delay: .3s; }
    @keyframes wv { from { height: 3px; } to { height: 20px; background: #f6d68f; } }
    .said { padding: 12px; border-radius: 18px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
    .said-h { font-size: 11.5px; font-weight: 600; color: var(--muted); }
    .said-v { direction: ltr; text-align: start; font-size: 22px; font-weight: 700; letter-spacing: 4px; min-height: 32px; margin-top: 2px; }
    [dir="rtl"] .said-v { text-align: right; }
    .caption { text-align: center; min-height: 22px; margin: 14px 0 0; font-size: 13.5px; color: var(--soft); }
    .caption.wow { color: #fff; font-weight: 700; font-size: 15px; }

    /* אזורים */
    section.block { margin-top: 44px; }
    .kicker { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent2); text-transform: uppercase; }
    [dir="rtl"] .kicker { letter-spacing: 0; font-size: 13px; }
    h2 { text-align: center; font-size: 25px; line-height: 1.25; margin: 8px 0 20px; font-weight: 700; letter-spacing: -.3px; }
    .diff { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .diff div { padding: 16px 8px 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); text-align: center; font-size: 13px; color: var(--soft); line-height: 1.4; }
    .diff svg { width: 26px; height: 26px; display: block; margin: 0 auto 8px; }
    .diff b { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
    .steps { display: grid; gap: 10px; }
    .step { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
    .num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: rgba(231,184,92,.12); color: var(--accent2); border: 1px solid rgba(231,184,92,.4); }
    .step b { display: block; font-size: 15.5px; }
    .step span { color: var(--muted); font-size: 14px; }
    .feat { list-style: none; margin: 0; padding: 6px 18px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); }
    .feat li { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; color: var(--muted); }
    .feat li:last-child { border-bottom: none; }
    .feat svg { flex: none; width: 20px; height: 20px; margin-top: 2px; }
    .feat b { color: var(--text); font-weight: 700; }

    /* התקנה */
    .card { padding: 18px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 12px; }
    .card h3 { margin: 0 0 12px; font-size: 16px; }
    .card ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
    .card ol li { counter-increment: s; position: relative; padding-inline-start: 34px; margin-bottom: 11px; font-size: 14.5px; color: var(--soft); }
    .card ol li::before { content: counter(s); position: absolute; inset-inline-start: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.07); color: var(--text); }
    .card ol li b { color: var(--text); }
    .note { font-size: 13px; color: var(--muted); margin-top: 10px; text-align: center; }
    .warn { border-color: rgba(251,146,60,.4); background: rgba(251,146,60,.06); }
    .vip { text-align: center; border-color: rgba(250,204,21,.4); background: rgba(250,204,21,.05); }
    .vip-label { font-size: 13px; color: #fde68a; font-weight: 700; }
    .vip-code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 26px; font-weight: 700; color: #facc15; letter-spacing: 1px; margin: 4px 0 10px; direction: ltr; }
    .vip-sub { font-size: 13px; color: var(--soft); margin-top: 8px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; color: var(--soft); font: inherit; font-weight: 700; cursor: pointer; }
    .tab.on { background: var(--text); color: #0a0a10; border-color: transparent; }
    .final { margin-top: 44px; padding: 26px 20px; border-radius: 24px; text-align: center; background: radial-gradient(100% 120% at 50% 0%, rgba(231,184,92,.18), transparent 70%), var(--panel); border: 1px solid var(--line2); }
    .final h2 { margin: 0 0 6px; }
    .final p { margin: 0 0 18px; color: var(--muted); }
    .foot { text-align: center; font-size: 12px; color: #5d5d6c; margin-top: 26px; }
    .foot a { color: #8a8a99; text-decoration: none; }
  </style>
</head>
<body>
<main>
  <nav class="nav">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="#1a1408"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="#1a1408" stroke-width="2.2" stroke-linecap="round"/></svg></span>
      Lockscreen
    </div>
    <button type="button" class="lang" id="langBtn">English</button>
  </nav>

  <header class="hero">
    <span class="eyebrow"><i></i><span data-t="eyebrow"></span></span>
    <h1 data-t="heroH"></h1>
    <p class="lead" data-t="lead"></p>
    <div class="cta-row">
      <a class="btn btn-grad" href="#install" data-t="ctaGet"></a>
      <a class="btn btn-ghost" href="#how" data-t="ctaHow"></a>
    </div>
    <div class="meta" data-t="meta"></div>
  </header>

  <!-- הדגמה חיה -->
  <div class="demo" aria-hidden="true">
    <div class="demo-grid">
      <div class="phone-col">
        <div class="phone" id="phone">
          <div class="screen">
            <div class="cam"></div>
            <div class="pin-title" data-t="pinTitle"></div>
            <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div class="keys" id="keys"></div>
          </div>
          <div class="finger" id="finger"></div>
        </div>
      </div>
      <div class="ear-col">
        <div class="ear">
          <div class="ear-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2.5" y="14" width="5" height="7" rx="2"/><rect x="16.5" y="14" width="5" height="7" rx="2"/></svg><span data-t="earH"></span></div>
          <div class="ear-word" id="earWord">&nbsp;</div>
          <div class="wave" id="wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="said">
          <div class="said-h" data-t="saidH"></div>
          <div class="said-v" id="saidV"></div>
        </div>
      </div>
    </div>
    <div class="caption" id="caption"></div>
  </div>

  <!-- בידול -->
  <section class="block">
    <div class="kicker" data-t="diffK"></div>
    <h2 data-t="diffH"></h2>
    <div class="diff">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#e7b85c" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.1 4.1M6.2 6.2A17 17 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 5-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg><b data-t="d1b"></b><span data-t="d1"></span></div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#e7b85c" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4l6 6M22 4l-6 6"/></svg><b data-t="d2b"></b><span data-t="d2"></span></div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#e7b85c" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg><b data-t="d3b"></b><span data-t="d3"></span></div>
    </div>
  </section>

  <!-- איך זה עובד -->
  <section class="block" id="how">
    <div class="kicker" data-t="howK"></div>
    <h2 data-t="howH"></h2>
    <div class="steps">
      <div class="step"><span class="num">1</span><div><b data-t="s1b"></b><span data-t="s1"></span></div></div>
      <div class="step"><span class="num">2</span><div><b data-t="s2b"></b><span data-t="s2"></span></div></div>
      <div class="step"><span class="num">3</span><div><b data-t="s3b"></b><span data-t="s3"></span></div></div>
    </div>
  </section>

  <!-- מה מקבלים -->
  <section class="block">
    <div class="kicker" data-t="featK"></div>
    <h2 data-t="featH"></h2>
    <ul class="feat">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#e7b85c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="f1"></span></li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#e7b85c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="f2"></span></li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#e7b85c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="f3"></span></li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#e7b85c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="f4"></span></li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#e7b85c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="f5"></span></li>
    </ul>
  </section>

  <!-- התקנה -->
  <section class="block" id="install">
    <div class="kicker" data-t="instK"></div>
    <h2 data-t="instH"></h2>

    <div class="card vip hide" id="vipCard">
      <div class="vip-label" data-t="vipLabel"></div>
      <div class="vip-code" id="vipCode"></div>
      <button type="button" class="btn btn-ghost" id="copyCodeBtn" data-t="copyCode"></button>
      <div class="vip-sub" data-t="vipSub"></div>
    </div>

    <div class="tabs" id="tabs">
      <button type="button" class="tab" data-os="android">Android</button>
      <button type="button" class="tab" data-os="ios">iPhone</button>
    </div>

    <div id="androidBox" class="hide">
      <div class="card">
        <a class="btn btn-main" id="apkBtn" href="Lockscreen.apk" download="Lockscreen.apk" data-t="download"></a>
        <div class="note" data-t="aNote"></div>
      </div>
      <div class="card">
        <h3 data-t="aStepsTitle"></h3>
        <ol>
          <li data-t="a1"></li>
          <li data-t="a2"></li>
          <li data-t="a3"></li>
          <li data-t="a4"></li>
          <li data-t="a5"></li>
        </ol>
      </div>
    </div>

    <div id="iosBox" class="hide">
      <div class="card warn hide" id="notSafari">
        <h3 data-t="nsTitle"></h3>
        <div style="font-size:14px; color:var(--soft);" data-t="nsText"></div>
        <button type="button" class="btn btn-ghost" id="copyLinkBtn" style="margin-top:12px; width:100%;" data-t="copyLink"></button>
      </div>
      <div class="card">
        <h3 data-t="iStepsTitle"></h3>
        <ol>
          <li data-t="i1"></li>
          <li data-t="i2"></li>
          <li data-t="i3"></li>
          <li data-t="i4"></li>
          <li data-t="i5"></li>
        </ol>
        <a class="btn btn-main" id="openAppBtn" href="./" style="margin-top:14px;" data-t="openApp"></a>
      </div>
    </div>

    <div class="card" id="firstMinute">
      <h3 data-t="fmTitle"></h3>
      <ol>
        <li data-t="fm1"></li>
        <li data-t="fm2"></li>
        <li data-t="fm3"></li>
        <li data-t="fm4"></li>
        <li data-t="fm5"></li>
      </ol>
    </div>
  </section>

  <div class="final">
    <h2 data-t="finalH"></h2>
    <p data-t="finalP"></p>
    <a class="btn btn-grad" href="#install" data-t="ctaGet"></a>
  </div>

  <div class="foot"><a href="terms.html" data-t="terms"></a> · <a href="privacy.html" data-t="privacy"></a></div>
</main>

<script>
  (function () {
    const T = {
      he: {
        eyebrow: 'חדש: קריאה בזמן אמת',

        ctaGet: 'להורדה',
        ctaHow: 'איך זה עובד',
        meta: 'אנדרואיד ואייפון · התקנה בפחות מדקה',
        pinTitle: 'הזן קוד PIN',
        earH: 'באוזנייה שלך',
        saidH: 'אתה אומר בקול',
        capStart: 'הצופה מקליד קוד סודי...',
        capWow: 'הצופה: "...רגע. איך?!"',
        diffK: 'למה זה שונה',
        diffH: 'שום דבר שהצופה יכול לתפוס',
        d1b: 'בלי להציץ', d1: 'אתה לא נוגע ולא מסתכל בטלפון',
        d2b: 'בלי שותף', d2: 'וגם בלי טלפון שני',
        d3b: 'הטלפון שלך', d3: 'נראה בדיוק כמו מסך הנעילה שלך',

    const params = new URLSearchParams(location.search);
    const ua = navigator.userAgent || '';
    const isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);
    // באייפון: דפדפן בתוך אפליקציה (וואטסאפ/אינסטגרם/פייסבוק) או דפדפן שאינו Safari
    const notSafari = isIOS && (/CriOS|FxiOS|EdgiOS|OPiOS|FBAN|FBAV|Instagram|Line\//i.test(ua) || !/Safari/i.test(ua));
    // שפה: לפי הקישור (?lang=en), אחרת עברית לכל מי שבישראל (גם אם הטלפון באנגלית)
    let tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    const langs = [].concat(navigator.languages || [], navigator.language || []);
    const israeli = /^(Asia\/Jerusalem|Asia\/Tel_Aviv)$/.test(tz) || langs.some((l) => /^(he|iw)/i.test(l));
    let lang = params.get('lang') ? (params.get('lang') === 'en' ? 'en' : 'he') : israeli ? 'he' : 'en';
    const code = String(params.get('c') || '').trim().toUpperCase();
    const validCode = /^[A-Z0-9-]{4,40}$/.test(code) ? code : '';

    function render() {
      const d = T[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-t]').forEach((el) => {
        el.innerHTML = d[el.dataset.t];
      });
      document.getElementById('langBtn').textContent = d.lang;
      document.title = 'Lockscreen';
    }

    function showOs(os) {
      document.getElementById('androidBox').classList.toggle('hide', os !== 'android');
      document.getElementById('iosBox').classList.toggle('hide', os !== 'ios');
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.os === os));
    }

    async function copy(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e2) {}
        ta.remove();
      }
      const old = btn.innerHTML;
      btn.innerHTML = T[lang].copied;
      setTimeout(() => (btn.innerHTML = old), 1600);
    }

    render();
    if (validCode) {
      document.getElementById('vipCard').classList.remove('hide');
      document.getElementById('vipCode').textContent = validCode;
    }
    document.getElementById('notSafari').classList.toggle('hide', !notSafari);
    // בטלפון מכירים את סוג המכשיר - לא צריך לשונית בחירה
    if (isAndroid || isIOS) document.getElementById('tabs').classList.add('hide');
    showOs(isIOS ? 'ios' : 'android');

    document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => showOs(t.dataset.os)));
    document.getElementById('copyCodeBtn').addEventListener('click', (e) => copy(validCode, e.currentTarget));
    document.getElementById('copyLinkBtn').addEventListener('click', (e) => copy(location.href, e.currentTarget));
    document.getElementById('langBtn').addEventListener('click', () => {
      lang = lang === 'he' ? 'en' : 'he';
      render();
    });

    // ---- הדגמה חיה: הצופה מקליד, הספרה נלחשת באוזנייה, הקוסם אומר אותה ----
    const WORDS = {
      he: ['אפס', 'אחת', 'שתיים', 'שלוש', 'ארבע', 'חמש', 'שש', 'שבע', 'שמונה', 'תשע'],
      en: ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine']
    };
    const keysEl = document.getElementById('keys');
    const phone = document.getElementById('phone');
    const finger = document.getElementById('finger');
    const dots = Array.from(document.querySelectorAll('.dot'));
    const earWord = document.getElementById('earWord');
    const wave = document.getElementById('wave');
    const saidV = document.getElementById('saidV');
    const caption = document.getElementById('caption');
    const keyMap = {};
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', ''].forEach((k) => {
      const d = document.createElement('div');
      d.className = 'key' + (k === '' ? ' blank' : '');
      d.textContent = k;
      if (k !== '') keyMap[k] = d;
      keysEl.appendChild(d);
    });
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    function fingerTo(k) {
      const kr = keyMap[k].getBoundingClientRect();
      const pr = phone.getBoundingClientRect();
      finger.style.left = (kr.left - pr.left + kr.width / 2) + 'px';
      finger.style.top = (kr.top - pr.top + kr.height / 2) + 'px';
      finger.classList.add('in');
    }
    function fingerAway() {
      finger.style.left = '50%';
      finger.style.top = '108%';
      finger.classList.remove('in');
    }
    async function round() {
      const digits = Array.from({ length: 4 }, () => String(Math.floor(Math.random() * 10)));
      dots.forEach((d) => d.classList.remove('on'));
      earWord.innerHTML = '&nbsp;';
      saidV.textContent = '';
      caption.classList.remove('wow');
      caption.textContent = T[lang].capStart;
      fingerAway();
      await sleep(1300);
      for (let j = 0; j < digits.length; j++) {
        const k = digits[j];
        fingerTo(k);
        await sleep(520);
        finger.classList.add('tap');
        keyMap[k].classList.add('hit');
        dots[j].classList.add('on');
        await sleep(130);
        finger.classList.remove('tap');
        keyMap[k].classList.remove('hit');
        // באוזנייה - מיד
        earWord.textContent = WORDS[lang][Number(k)];
        wave.classList.add('on');
        await sleep(600);
        wave.classList.remove('on');
        // הקוסם אומר בקול
        saidV.textContent = digits.slice(0, j + 1).join(' ');
        await sleep(650);
      }
      fingerAway();
      caption.classList.add('wow');
      caption.textContent = T[lang].capWow;
      await sleep(3200);
    }
    (async () => {
      await sleep(400);
      for (;;) await round();
    })();
  })();
</script>
