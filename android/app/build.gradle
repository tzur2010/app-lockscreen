apply plugin: 'com.android.application'

android {
    namespace "com.magic.lockscreen"
    compileSdk 34

    defaultConfig {
        applicationId "com.magic.lockscreen"
        minSdk 24
        targetSdk 34
        // בכל עדכון: להעלות את שניהם (versionName זהה ל-APP_VERSION ב-app.js)
        versionCode 44
        versionName "4.4"
    }

    // מפתח החתימה הקבוע של האפליקציה (android/keystore.properties + magic-release.keystore).
    // כל עדכון חייב להיחתם באותו מפתח, אחרת אנדרואיד לא יתקין אותו מעל הגרסה הקיימת.
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
